name: Release Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for manual reruns)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop renderer
        working-directory: desktop
        run: npm run build

      - name: Validate desktop dist contents
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/dist/index.html")) {
            throw "desktop/dist/index.html is missing after build."
          }

          $jsBundle = Get-ChildItem "desktop/dist/assets" -Filter "index-*.js" -ErrorAction SilentlyContinue
          $cssBundle = Get-ChildItem "desktop/dist/assets" -Filter "index-*.css" -ErrorAction SilentlyContinue
          if (!$jsBundle) {
            throw "No hashed JS bundle found in desktop/dist/assets."
          }
          if (!$cssBundle) {
            throw "No hashed CSS bundle found in desktop/dist/assets."
          }

          $indexHtml = Get-Content "desktop/dist/index.html" -Raw
          if ($indexHtml -match 'src="/assets/' -or $indexHtml -match 'href="/assets/') {
            throw "desktop/dist/index.html contains absolute /assets paths that break packaged Electron builds."
          }

          Write-Host "Desktop dist validation passed."
          Write-Host "JS bundle: $($jsBundle[0].Name)"
          Write-Host "CSS bundle: $($cssBundle[0].Name)"

      - name: Archive desktop dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if (Test-Path "artifacts/desktop-dist") {
            Remove-Item "artifacts/desktop-dist" -Recurse -Force
          }
          Copy-Item "desktop/dist" "artifacts/desktop-dist" -Recurse -Force
          Compress-Archive -Path "artifacts/desktop-dist" -DestinationPath "artifacts/desktop-dist.zip" -Force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Windows installer
        working-directory: desktop
        run: npm run package:win

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if (!(Test-Path "desktop/release")) {
            throw "desktop/release output directory not found after installer build."
          }
          Copy-Item "desktop/release/*.exe" artifacts/ -Force -ErrorAction SilentlyContinue
          Copy-Item "desktop/release/*.blockmap" artifacts/ -Force -ErrorAction SilentlyContinue
          Copy-Item "desktop/release/latest*.yml" artifacts/ -Force -ErrorAction SilentlyContinue

      - name: Build sidecar Python distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Collect sidecar distributions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item dist/* artifacts/

      - name: Determine release metadata
        id: metadata
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ inputs.tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Unable to determine release tag."
          }

          $isPreRelease = $false
          if ($tag -match "-(alpha|beta|rc)") {
            $isPreRelease = $true
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPreRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/desktop-dist.zip
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest*.yml
            artifacts/*.whl
            artifacts/*.tar.gz

      # Phase 6 follow-up:
      # Integrate sidecar/runtime bundling into installer and upload signed
      # installer artifacts once code signing is configured.
