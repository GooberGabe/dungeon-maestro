name: Release Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for manual reruns)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop renderer
        working-directory: desktop
        run: npm run build

      - name: Archive desktop dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path desktop/dist/* -DestinationPath artifacts/desktop-dist.zip -Force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sidecar Python distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Collect sidecar distributions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item dist/* artifacts/

      - name: Determine release metadata
        id: metadata
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ inputs.tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Unable to determine release tag."
          }

          $isPreRelease = $false
          if ($tag -match "-(alpha|beta|rc)") {
            $isPreRelease = $true
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPreRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/desktop-dist.zip
            artifacts/*.whl
            artifacts/*.tar.gz

      # Phase 6 follow-up:
      # Add installer generation here (electron-builder + sidecar bundle integration)
      # and upload signed installer artifacts once code signing is configured.
