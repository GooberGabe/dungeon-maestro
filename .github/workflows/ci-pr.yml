name: CI PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Desktop and Sidecar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run desktop unit tests
        working-directory: desktop
        run: npm run test:unit

      - name: Build desktop renderer
        working-directory: desktop
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e .

      - name: Run sidecar unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run sidecar integration smoke test
        run: |
          python -c "from pathlib import Path; from dungeon_maestro_sidecar.config import load_pipeline_config; settings, soundscapes = load_pipeline_config(Path('dungeon-maestro.yaml.example')); assert settings.default_soundscape == 'starter'; assert len(soundscapes) > 0"

      - name: Validate sidecar syntax
        run: python -m compileall src/dungeon_maestro_sidecar

      - name: Build sidecar Python distributions
        run: python -m build

      - name: Upload desktop dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: desktop/dist
          if-no-files-found: error

      - name: Upload sidecar dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-dist
          path: dist
          if-no-files-found: error
